name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run docs:check
      - run: npm run skill:verify
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Engine contract smoke test
        run: |
          SMOKE_PREFIX="$RUNNER_TEMP/jintia-engine-smoke"
          rm -rf "$SMOKE_PREFIX"
          npm install \
            --prefix "$SMOKE_PREFIX" \
            --no-save \
            --no-audit \
            --no-fund \
            @charlie.act7/jintia@latest @vivliostyle/cli @vivliostyle/theme-base
          VIV_BIN_NAME="vivliostyle"
          if [ "$RUNNER_OS" = "Windows" ]; then VIV_BIN_NAME="vivliostyle.cmd"; fi
          # node reporta process.cwd() en formato nativo del SO incluso
          # corriendo bajo Git Bash en Windows: evita que la ruta quede en
          # formato POSIX (/d/...) al pasarla como JINTIA_VIVLIOSTYLE_BIN a
          # un proceso nativo (cmd.exe), que es lo que hacía que "where.exe"
          # vía PATH nunca encontrara el binario instalado localmente aquí.
          export JINTIA_VIVLIOSTYLE_BIN="$(cd "$SMOKE_PREFIX/node_modules/.bin" && node -e "console.log(require('path').join(process.cwd(), '$VIV_BIN_NAME'))")"
          echo "JINTIA_VIVLIOSTYLE_BIN=$JINTIA_VIVLIOSTYLE_BIN"
          ls -la "$SMOKE_PREFIX/node_modules/.bin"
          node -e "console.log(require(process.argv[1]).checkVivliostyle())" "$SMOKE_PREFIX/node_modules/@charlie.act7/jintia/skill/scripts/vivliostyle-adapter"
          printf '<!doctype html><html><body><p>diagnostico</p></body></html>' > "$SMOKE_PREFIX/diag.html"
          node -e "require(process.argv[1]).buildPdf(process.argv[2], process.argv[3], { verbose: true })" \
            "$SMOKE_PREFIX/node_modules/@charlie.act7/jintia/skill/scripts/vivliostyle-adapter" \
            "$SMOKE_PREFIX/diag.html" \
            "$SMOKE_PREFIX/diag.pdf"
          node \
            "$SMOKE_PREFIX/node_modules/@charlie.act7/jintia/skill/bin/jintia.js" \
            self-test \
            --json
        shell: bash
      - name: NotebookLM MCP browser contract smoke
        run: node scripts/smoke-notebooklm-browser.mjs
