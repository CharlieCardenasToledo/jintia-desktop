name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run skill:verify
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Engine contract smoke test
        run: |
          SMOKE_PREFIX="$RUNNER_TEMP/jintia-engine-smoke"
          rm -rf "$SMOKE_PREFIX"
          npm install \
            --prefix "$SMOKE_PREFIX" \
            --no-save \
            --no-audit \
            --no-fund \
            @charlie.act7/jintia@latest
          node \
            "$SMOKE_PREFIX/node_modules/@charlie.act7/jintia/skill/bin/jintia.js" \
            doctor \
            --json
        shell: bash
      - name: NotebookLM MCP browser contract smoke
        run: node scripts/smoke-notebooklm-browser.mjs
