name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run skill:verify
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Engine contract smoke test
        run: |
          if [ -f "src-tauri/target/debug/build/jintia-desktop-*/out/jintia-skill/bin/jintia.js" ]; then
            node src-tauri/target/debug/build/jintia-desktop-*/out/jintia-skill/bin/jintia.js doctor --json
          fi
        shell: bash
